  <style>
    @font-face{font-family:"Public Sans";src:url("fonts/public-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}

    *{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 "Public Sans",sans-serif}button,input,select{font:inherit}a{color:var(--primary);text-underline-offset:4px}button,a,input,select{touch-action:manipulation}button,select{cursor:pointer}button,a{transition:background-color .16s,color .16s}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ring);outline-offset:3px}button:disabled{cursor:wait;opacity:.7}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-weight:600;text-decoration:none}button:hover,.button:hover{background:var(--muted)}button.primary,.button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}button.primary:hover{filter:brightness(.9)}button.danger{background:var(--destructive);border-color:var(--destructive);color:var(--primary-foreground)}.skip{position:absolute;top:-100px;left:16px;z-index:5}.skip:focus{top:10px;background:var(--card);padding:12px}.preview{padding:12px 32px;background:var(--foreground);color:var(--card);display:flex;align-items:center;gap:16px;font-size:14px}.preview strong{margin-right:auto}.preview label{display:flex;gap:8px;align-items:center}.preview select{max-width:170px;min-height:44px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--card);color:var(--foreground)}.preview a{color:var(--card);min-height:44px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.5px}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--primary);color:var(--primary-foreground);border-radius:9px;font-size:18px}.shell{max-width:1248px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);m uctive)}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}.actions a:not(.button){padding:10px 0;min-height:44px}.section{padding:24px 0;border-bottom:1px solid var(--border)}.section:first-child{padding-top:0}.section p{font-size:14px;color:var(--muted-foreground);margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{font-size:13px;font-weight:600;border-radius:20px;background:var(--muted);color:var(--success);padding:5px 10px;white-space:nowrap}.notice{background:var(--muted);border-left:3px solid var(--primary);padding:16px 18px;border-radius:0 6px 6px 0;margin-bottom:24px;font-size:14px}.notice p{margin:4px 0 0}.notice.error{border-color:var(--destructive);color:var(--destructive)}.notice.success{border-color:var(--success);color:var(--success)}.quiet{font-size:14px;color:var(--muted-foreground);margin-top:24px}.companion{display:none}.home-greeting{padding:24px 0 32px}.home-greeting .avatar{margin-bottom:24px}.home-list{border-top:1px solid var(--border)}.home-list a{display:block;text-decoration:none;padding:22px 0;border-bottom:1px solid var(--border)}.home-list strong{display:block;color:var(--foreground);font-size:18px;margin-bottom:4px}.home-list span{color:var(--muted-foreground);font-size:14px}.checkline{display:flex;gap:12px;align-items:start;font-size:14px;margin:20px 0}.checkline input{width:20px;height:20px;flex-shrink:0;accent-color:var(--primary)}.recovery{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);font-variant-numeric:tabular-nums}.auth-divider{text-align:center;position:relative;margin:24px 0;color:var(--muted-foreground);font-size:14px}.full{width:100%}.danger-text{color:var(--destructive)}.demo-note{font-size:12px;color:var(--muted-foreground);margin-top:40px}.proof{display:block;padding:12px 0;font-size:14px}dialog{border:1px solid var(--border);border-radius:12px     body[data-direction=b]{--background:#e7eef4}body[data-direction=b] .shell{display:block;max-width:1280px}body[data-direction=b] .sidebar{padding:24px 40px;display:flex;align-items:center;gap:48px;border-right:0;border-bottom:1px solid var(--border)}body[data-direction=b] .sidebar nav{display:flex;gap:8px;margin:0}body[data-direction=b] .sidebar nav a[aria-current=page]{box-shadow:inset 0 -3px var(--primary);background:transparent}body[data-direction=b] .identity{margin:0 0 0 auto}body[data-direction=b] .workspace{padding:40px}body[data-direction=b] .crumb{margin-bottom:20px}body[data-direction=b] .layout{grid-template-columns:minmax(0,1fr) 300px;background:var(--card);border-radius:16px;overflow:hidden}body[data-direction=b] .form-panel{padding:36px 40px;max-width:none}body[data-direction=b] .page-head{margin-bottom:28px}body[data-direction=b] .companion{display:block;padding:36px 28px;background:var(--companion);color:var(--companion-foreground)}.companion h2{font-size:26px;line-height:1.2}.companion p{font-size:14px;color:var(--companion-muted)}.companion ul{list-style:none;padding:0;margin:32px 0}.companion li{padding:20px 0;border-top:1px solid var(--companion-muted)}.companion li span{display:block;font-size:14px;margin-top:6px;color:var(--companion-muted)}.companion a{color:var(--companion-foreground);display:inline-block;min-height:44px;padding:10px 0}.shield{height:44px;width:44px;margin-bottom:24px}.companion .companion-note{padding-top:24px;border-top:1px solid var(--companion-muted);margin-top:32px}.auth .form-panel{max-width:480px}body[data-direction=b] .auth .form-panel{max-width:none}
    @media(max-width:1000px){.workspace{padding:36px}.shell{grid-template-columns:200px minmax(0,1fr)}body[data-direction=b] .sidebar{gap:20px;padding:20px}body[data-direction=b] .identity{display:none}body[data-direction=b] .workspace{padding:28px}body[data-direction=b] .layout{grid-template-columns:minmax(0,1fr) 260px}body[data-direction=b] .form-panel{padding:28px}}
    @media(max-width:700px){.preview{padding:12px 16px;gap:8px;flex-wrap:wrap}.preview strong{width:100%;margin:0}.preview label{gap:6px}.preview select{max-width:130px;font-size:14px}.preview a{margin-left:auto}.shell{display:block}.sidebar{padding:20px 20px 0;border-right:0;border-bottom:1px solid var(--border)}.sidebar nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:20px}.sidebar nav a{padding:10px 12px;font-size:14px}.sidebar nav a[aria-current=page]{box-shadow:inset 0 -3px var(--primary);border-radius:6px 6px 0 0}.identity{display:none}.workspace{padding:28px 20px 40px}.crumb{margin-bottom:20px}h1{font-size:32px;letter-spacing:-1px}.page-head{margin-bottom:28px}.avatar{width:64px;height:64px;border-radius:18px;font-size:24px}.avatar-row{gap:16px;padding-bottom:24px;margin-bottom:24px}.row{align-items:start;flex-wrap:wrap}.actions{margin-top:24px}.actions button{flex-grow:1}.form-panel{max-width:none}.demo-note{margin-top:28px}body[data-direction=b] .sidebar{display:block;padding:20px 20px 0}body[data-direction=b] .sidebar nav{margin-top:20px;flex-wrap:wrap}body[data-direction=b] .workspace{padding:28px 16px}body[data-direction=b] .layout{grid-template-columns:minmax(0,1fr);border-radius:12px}body[data-direction=b] .form-panel{padding:24px 20px}body[data-direction=b] .companion{padding:28px 24px}.preview .preview-state{margin-left:0}.recovery{padding:16px;font-size:14px}dialog{padding:24px}}
    .section+.field{margin-top:24px}.preview :focus-visible,.companion :focus-visible{outline-color:var(--card)}
    @media(max-width:700px){.preview{position:relative;padding-top:12px;padding-bottom:12px}.preview strong{padding-right:64px;font-size:12px}.preview a{position:absolute;right:16px;top:0;font-size:12px}.preview label{font-size:12px}.preview select{max-width:126px}.field{margin-bottom:18px}}
